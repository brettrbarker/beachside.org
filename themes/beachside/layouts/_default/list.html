{{ define "main" }}
<section class="listing-page wrap">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <div class="simple-list">
    {{ range .Pages.ByTitle }}
      <a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong>{{ with .Description }}<span>{{ . }}</span>{{ end }}</a>
    {{ end }}
  </div>
</section>
{{ end }}
