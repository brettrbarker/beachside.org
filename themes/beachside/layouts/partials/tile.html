<a class="image-tile{{ if .featured }} tile-featured{{ end }}" href="{{ if hasPrefix .url "http" }}{{ .url }}{{ else }}{{ .url | relURL }}{{ end }}"{{ if .external }} target="_blank" rel="noopener"{{ end }} style="--tile-image: url('{{ .image | relURL }}')">
  <span class="tile-shade"></span>
  <span class="tile-copy">
    <strong>{{ .title }}</strong>
    {{ with .description }}<span>{{ . }}</span>{{ end }}
  </span>
</a>
