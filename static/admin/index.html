<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beachside Church CMS</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1eb;
        --panel: #fff;
        --text: #1d2a2f;
        --muted: #607076;
        --accent: #0d5a66;
        --accent-strong: #0b4854;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8f5f2 0%, #eef4f5 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(90vw, 720px);
        background: var(--panel);
        border: 1px solid rgba(13, 90, 102, 0.12);
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(11, 72, 84, 0.12);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 3vw, 2.75rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .tag {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(13, 90, 102, 0.08);
        color: var(--accent-strong);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="tag">Beachside Church</div>
      <h1>Content Editor</h1>
      <p>Use this admin view to add and update messages for the church website.</p>

      <div id="identity-diag" style="margin-top:1rem;font-size:0.95rem;color:var(--muted)">
        <div><strong>Netlify Identity status:</strong> <span id="identity-status">Checking…</span></div>
        <div style="margin-top:0.5rem;">
          <button id="identity-refresh" style="padding:0.35rem 0.6rem;border-radius:6px;border:1px solid rgba(13,90,102,0.12);background:#fff;color:var(--accent);cursor:pointer">Refresh</button>
          <a id="identity-admin-link" href="/admin/" style="margin-left:0.8rem;color:var(--accent);text-decoration:underline;">Open admin</a>
        </div>
        <pre id="identity-body" style="margin-top:0.75rem;padding:0.6rem;border-radius:8px;background:#f7fafb;color:#0b4954;display:none;max-height:220px;overflow:auto"></pre>
        <div id="identity-hash" style="margin-top:0.5rem;color:var(--muted);font-size:0.85rem"></div>
      </div>
    </main>

    <!-- Netlify Identity widget: handles invite confirmations and logins -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Initialize Netlify Identity if available. This processes email confirmation
      // tokens when the user lands on the site and exposes the login UI used by
      // Decap CMS (git-gateway backend).
      (function () {
        if (window.netlifyIdentity) {
          try {
            window.netlifyIdentity.init();
          } catch (e) {
            // Some older browsers or CSP restrictions might block init; log a helpful message.
            // eslint-disable-next-line no-console
            console.warn('Netlify Identity failed to initialize:', e);
          }

          // When a user logs in, navigate to the admin root so the CMS can load the
          // authenticated session and collections. This helps after an email
          // confirmation redirects to the site with a token in the URL.
          window.netlifyIdentity.on('login', () => {
            // Remove the fragment token from the URL for cleanliness after handled
            if (window.location.hash && (window.location.hash.indexOf('access_token') !== -1 || window.location.hash.indexOf('confirmation_token') !== -1)) {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            // Reload admin so Decap picks up the authenticated session
            window.location.href = '/admin/';
          });

          // Optional: open the identity modal when the admin page loads and there's
          // no user, prompting the editor to sign in. Comment out if you prefer
          // users click the login button manually.
          // if (!window.netlifyIdentity.currentUser()) {
          //   window.netlifyIdentity.open();
          // }
        }
      })();
    </script>

    <script>
      // Diagnostic fetch of /.netlify/identity/ to help debug 404/401 issues.
      (function () {
        const statusEl = document.getElementById('identity-status');
        const bodyEl = document.getElementById('identity-body');
        const refreshBtn = document.getElementById('identity-refresh');
        const hashEl = document.getElementById('identity-hash');

        async function check() {
          statusEl.textContent = 'Checking…';
          bodyEl.style.display = 'none';
          try {
            const res = await fetch('/.netlify/identity/');
            statusEl.textContent = `${res.status} ${res.statusText}`;
            const text = await res.text();
            if (text && text.trim()) {
              bodyEl.style.display = 'block';
              const snippet = text.length > 2000 ? text.slice(0,2000) + '\n\n...(truncated)' : text;
              bodyEl.textContent = snippet;
            }
            if (res.status === 404) {
              statusEl.textContent += ' — Identity not enabled on this site';
            } else if (res.status === 401) {
              statusEl.textContent += ' — endpoint reachable; authentication required (expected)';
            }
          } catch (err) {
            statusEl.textContent = 'Error: ' + err.message;
          }

          // show any hash fragments (access_token or confirmation_token)
          const hash = window.location.hash || '';
          if (hash) {
            hashEl.textContent = `URL fragment: ${hash}`;
          } else {
            hashEl.textContent = '';
          }
        }

        refreshBtn.addEventListener('click', check);
        // Run once on load
        check();
      })();
    </script>

    <!-- Local Decap CMS bundle (self-hosted to avoid remote fetch/source-map issues) -->
    <script src="decap-cms.js"></script>
  </body>
</html>
