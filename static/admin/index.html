<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beachside Church CMS</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1eb;
        --panel: #fff;
        --text: #1d2a2f;
        --muted: #607076;
        --accent: #0d5a66;
        --accent-strong: #0b4854;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8f5f2 0%, #eef4f5 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(90vw, 720px);
        background: var(--panel);
        border: 1px solid rgba(13, 90, 102, 0.12);
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(11, 72, 84, 0.12);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 3vw, 2.75rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .tag {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(13, 90, 102, 0.08);
        color: var(--accent-strong);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="tag">Beachside Church</div>
      <h1>Content Editor</h1>
      <p>Use this admin view to add and update messages for the church website.</p>
    </main>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
