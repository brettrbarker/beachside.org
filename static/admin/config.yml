backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "static/images/messages"
public_folder: "/images/messages"

collections:
  - name: "messages"
    label: "Messages"
    folder: "content/messages"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss-05:00", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Speaker", name: "speaker", widget: "string" }
      - { label: "Series", name: "series", widget: "string", required: false }
      - { label: "Part Number", name: "part_number", widget: "number", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Video URL", name: "video_url", widget: "string", required: false }
      - { label: "Audio URL", name: "audio_url", widget: "string", required: false }
      - { label: "Guide URL", name: "guide_url", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
